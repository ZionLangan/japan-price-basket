<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japan Inflation · Staple price test</title>
<style>
:root{--ink:#203731;--muted:#5a6861;--paper:#f5f3ed;--card:#fffefa;--line:#dadfd6;--green:#25614c;--gold:#b4712f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Yu Gothic",sans-serif}
main{max-width:1120px;margin:auto;padding:28px 30px 60px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;gap:16px}
.brand{font-size:14px;letter-spacing:.13em;font-weight:700}button,select,input{font:inherit}button{cursor:pointer;padding:7px 12px;border:1px solid var(--line);background:transparent;border-radius:7px;color:var(--ink)}button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c68d48;outline-offset:3px}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--green);font-weight:700;margin:38px 0 10px}h1{font-size:clamp(30px,4vw,48px);line-height:1.2;letter-spacing:-.025em;margin:0 0 16px}h2{font-size:21px;margin:0}p{margin:10px 0}.intro{max-width:790px;color:var(--muted)}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:21px 0 27px}.pill{border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;background:var(--card)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{background:var(--card);padding:21px;border:1px solid var(--line);border-radius:12px}.metric small{color:var(--muted)}.number{font-size:clamp(27px,3.6vw,39px);line-height:1.4;font-weight:650;font-variant-numeric:tabular-nums}.number.change{color:var(--gold)}.comparison{padding:22px 0 24px;max-width:820px}.bar-row{display:grid;grid-template-columns:130px 1fr 95px;align-items:center;gap:12px;font-size:13px;margin:10px 0}.track{height:18px;border-radius:3px;background:#e4e8de;overflow:hidden}.bar{height:100%;background:#97a894;min-width:1px}.bar.current{background:var(--green)}.bar-value{text-align:right;font-variant-numeric:tabular-nums}.status{color:var(--muted);font-size:14px;margin:14px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px;padding:23px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.baseline-control{display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}select{padding:6px;background:white;border:1px solid var(--line);border-radius:6px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:15px;min-width:640px}th{font-size:12px;color:var(--muted);font-weight:650;text-align:left;border-bottom:1px solid var(--line);padding:9px 8px}td{border-bottom:1px solid #eceee6;padding:13px 8px;font-size:14px;vertical-align:middle}td:first-child{padding-left:0}th:first-child{padding-left:0}tr:last-child td{border-bottom:0}.right{text-align:right;font-variant-numeric:tabular-nums}.quantity{width:70px;padding:5px;border:1px solid var(--line);border-radius:5px;background:#fff}.item-label{display:flex;align-items:center;gap:10px;font-weight:600}input[type=checkbox]{accent-color:var(--green);width:17px;height:17px}.item-unit{display:block;color:var(--muted);font-size:12px;margin-left:28px}.note{font-size:13px;color:var(--muted)}.footnote{max-width:880px;margin-top:28px;font-size:13px;color:var(--muted)}details{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}summary{cursor:pointer;font-weight:600;font-size:14px}a{color:var(--green)}.sources{font-size:12px;overflow-wrap:anywhere;padding-left:20px}.break-title{color:#85531f}.warning{color:#85531f;border-left:3px solid #b4712f;padding-left:12px}.reset{font-size:13px}.hidden{display:none!important}.rule{margin-top:10px;color:var(--muted);font-size:13px}.blocked-row td{vertical-align:top}.blocked-row .item-unit{margin-top:4px}.blocked-reason{max-width:330px;font-size:12px;color:var(--muted)}
@media(max-width:650px){main{padding:20px 16px 40px}.brand{font-size:11px}.languages{display:flex;gap:3px}button{font-size:13px;padding:6px 9px}.metrics{gap:8px}.metric{padding:13px 9px}.metric small{font-size:11px}.number{font-size:25px}.panel{padding:16px}.bar-row{grid-template-columns:93px 1fr 75px;gap:7px}.eyebrow{margin-top:28px}}
</style>
</head>
<body><main>
<header><div class="brand">JAPAN INFLATION / PRICE LAB</div><div class="languages" aria-label="Language"><button id="english" aria-pressed="true">English</button> <button id="japanese" aria-pressed="false">日本語</button></div></header>
<div class="eyebrow" data-t="eyebrow"></div><h1 data-t="title"></h1><p class="intro" data-t="intro"></p>
<div class="meta"><span class="pill" data-t="area"></span><span class="pill" data-t="source"></span><span class="pill" data-t="latest"></span></div>
<section class="metrics" aria-label="Basket comparison"><div class="metric"><small id="beforeLabel"></small><div class="number" id="before">—</div></div><div class="metric"><small id="afterLabel"></small><div class="number" id="after">—</div></div><div class="metric"><small data-t="change"></small><div class="number change" id="change" aria-live="polite">—</div><small id="difference"></small></div></section>
<div class="comparison" id="bars"><div class="bar-row"><span id="oldBarLabel"></span><div class="track"><div class="bar" id="oldBar"></div></div><span class="bar-value" id="oldBarValue"></span></div><div class="bar-row"><span id="newBarLabel"></span><div class="track"><div class="bar current" id="newBar"></div></div><span class="bar-value" id="newBarValue"></span></div></div><p class="status" id="status"></p>
<section class="panel"><div class="panel-head"><h2 data-t="basket"></h2><label class="baseline-control"><span data-t="baseline"></span><select id="baseline"><option value="2000-01"></option><option value="2000-08"></option></select></label></div><p class="rule" data-t="quantityHelp"></p><div class="table-wrap"><table><thead><tr><th data-t="item"></th><th class="right" data-t="quantity"></th><th class="right" id="oldHeading"></th><th class="right" id="newHeading"></th><th class="right" data-t="itemChange"></th></tr></thead><tbody id="items"></tbody></table></div><button class="reset" id="reset" data-t="reset"></button></section>
<section class="panel"><h2 class="break-title" data-t="breakTitle"></h2><p class="rule" data-t="breakHelp"></p><div class="table-wrap"><table><thead><tr><th data-t="item"></th><th class="right" id="blockedOldHeading"></th><th class="right" id="blockedNewHeading"></th><th data-t="whyBlocked"></th></tr></thead><tbody id="blocked"></tbody></table></div></section>
<div class="footnote"><p data-t="method"></p><p data-t="coverage"></p><p data-t="latestReason"></p><p data-t="review"></p><details><summary data-t="sourcesTitle"></summary><p data-t="evidence"></p><ul class="sources" id="sources"></ul><a href="staple-price-test.json" download data-t="download"></a></details></div>
</main>
<script id="pilot-data" type="application/json">__PILOT_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('pilot-data').textContent);
const text={en:{eyebrow:'Public-data test · No API credentials',title:'What do the basics cost now?',intro:'Compare a small basket of surveyed retail prices in Tokyo. Change the quantities or use an August 2000 baseline to compare the same calendar month.',area:'Tokyo wards',source:'Official monthly prices · Tax included',latest:'Latest complete basket: August 2026',change:'Basket price change',basket:'Build the test basket',baseline:'Compare from',quantityHelp:'Start with one listed unit of each item. Quantities stay fixed at both dates. Your choices are saved in this browser.',item:'Item / quoted unit',quantity:'Quantity',itemChange:'Unit-price change',reset:'Reset example',breakTitle:'Items needing a specification review',breakHelp:'These are real published prices, but their definitions or units changed. Selecting one blocks the basket comparison until the break is resolved.',whyBlocked:'Why the comparison is blocked',method:'Cost = sum of quantity × published unit price. Change = (new cost ÷ old cost − 1) × 100. This is an illustrative basket of five staples, not official CPI or a representative household shopping basket. Prices are nominal and include tax.',coverage:'This test uses two endpoints, with January and August 2000 available as baselines. The intervening 26 years have not been backfilled; no continuous trend is implied. Produce also varies with weather and season.',latestReason:'Checked 5 October 2026. The September Tokyo release includes complete September prices for some packaged goods, but only ten-day September observations for fresh foods. August is the latest complete month shared by this basket.',review:'The five eligible items have matching endpoint specifications and units, checked against the 2001–2026 change workbook. The 2010 potato rename is resolved as a name-only change. This limited check does not certify the entire catalog.',sourcesTitle:'Sources and reproducible evidence',evidence:'Statistics Bureau of Japan, Retail Price Survey (Trend), distributed by e-Stat. Calculations and translations by this project. Raw files, SHA-256 receipts, sheet names, row numbers and columns are retained in the repository. Shared January 2000 and August 2026 values agree across separate survey publications.',download:'Download the data and provenance (JSON)',empty:'Select at least one item with a positive quantity.',invalid:'Enter a valid, non-negative quantity for every selected item.',blocked:'Comparison blocked: remove the selected item(s) with unresolved specification changes.',ready:'{n} items · fixed quantities at both dates · {season}',season:'January versus August includes seasonal differences.',sameMonth:'August versus August compares the same calendar month; it is not seasonally adjusted.'},
ja:{eyebrow:'公開データのテスト · API認証情報は不要',title:'いつもの品目、今はいくら？',intro:'東京都区部の調査価格を使い、小さな買い物かごを比較します。数量を変更したり、2000年8月を基準にして同じ暦月どうしを比べたりできます。',area:'東京都区部',source:'公的な月次価格 · 税込み',latest:'全品目の最新完全月：2026年8月',change:'買い物かごの価格変化',basket:'テスト用の買い物かご',baseline:'比較の基準月',quantityHelp:'初期値は各品目の表示単位を1つずつ。両時点で数量は固定します。選択はこのブラウザーに保存されます。',item:'品目・価格の単位',quantity:'数量',itemChange:'単価の変化',reset:'初期値に戻す',breakTitle:'基本銘柄の確認が必要な品目',breakHelp:'実際の公表価格ですが、基本銘柄や単位が変わっています。選択すると、変更の扱いが解決されるまで買い物かご全体の比較を停止します。',whyBlocked:'比較を停止する理由',method:'費用＝数量×公表単価の合計。変化率＝（新しい費用÷古い費用−1）×100。これは5品目を使った例であり、公式の消費者物価指数や標準的な世帯の買い物かごではありません。価格は税込みの名目額です。',coverage:'このテストは両端の時点を使い、基準月は2000年1月または8月です。途中の26年間はまだ取得しておらず、連続した推移を表すものではありません。野菜の価格は天候や季節にも左右されます。',latestReason:'2026年10月5日に確認。東京都区部の9月の公表表には一部の加工食品の9月価格がありますが、生鮮食品は9月の旬別観測のみです。この買い物かごの全品目に共通する最新の完全月は8月です。',review:'対象の5品目は両時点の基本銘柄と単位が一致し、2001～2026年の新旧対照表を確認済みです。2010年のじゃがいもの変更は名称のみとして解決しています。この限定的な確認は、調査全品目の比較可能性を保証するものではありません。',sourcesTitle:'出典と再現用データ',evidence:'出典：総務省統計局「小売物価統計調査（動向編）」、e-Statの公表ファイル。計算・翻訳は本プロジェクトによるものです。原本、SHA-256の記録、シート名、行番号、列番号を保存しています。2000年1月と2026年8月の値は別の公表表でも一致を確認しました。',download:'データと出典記録をダウンロード（JSON）',empty:'数量が正の品目を1つ以上選んでください。',invalid:'選択した全品目に0以上の有効な数量を入力してください。',blocked:'比較を停止中：基本銘柄の変更が未解決の品目を選択から外してください。',ready:'{n}品目 · 両時点で数量固定 · {season}',season:'1月と8月の比較には季節差が含まれます。',sameMonth:'8月どうしの比較です。季節調整はしていません。'}};
const eligible=data.items.filter(i=>i.eligible),blocked=data.items.filter(i=>!i.eligible);
const storageKey='japan-inflation-staple-pilot-v1';
const defaults=()=>({lang:'en',baseline:'2000-01',quantities:Object.fromEntries(eligible.map(i=>[i.code,1])),selected:eligible.map(i=>i.code),blocked:[]});
let state=defaults();
try{const s=JSON.parse(localStorage.getItem(storageKey));if(s&&['en','ja'].includes(s.lang)&&['2000-01','2000-08'].includes(s.baseline)&&s.quantities&&Array.isArray(s.selected)&&Array.isArray(s.blocked)){state={...state,lang:s.lang,baseline:s.baseline,selected:s.selected.filter(c=>eligible.some(i=>i.code===c)),blocked:s.blocked.filter(c=>blocked.some(i=>i.code===c))};for(const i of eligible){const q=s.quantities[i.code];if(typeof q==='number'&&Number.isFinite(q)&&q>=0)state.quantities[i.code]=q;}}}catch{}
const $=id=>document.getElementById(id),t=key=>text[state.lang][key],name=i=>i['name_'+state.lang];
const money=v=>new Intl.NumberFormat(state.lang==='ja'?'ja-JP':'en-US',{style:'currency',currency:'JPY',maximumFractionDigits:2}).format(v);
const percent=v=>(v>=0?'+':'')+v.toFixed(1)+'%';
const date=p=>new Intl.DateTimeFormat(state.lang==='ja'?'ja-JP':'en-US',{year:'numeric',month:'long',timeZone:'UTC'}).format(new Date(p+'-01T00:00:00Z'));
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{}};
function cell(value,cls=''){const c=document.createElement('td');c.className=cls;c.textContent=value;return c;}
function renderRows(){
 $('items').replaceChildren();
 for(const i of eligible){const tr=document.createElement('tr'),first=document.createElement('td'),label=document.createElement('label');label.className='item-label';const check=document.createElement('input');check.type='checkbox';check.checked=state.selected.includes(i.code);check.setAttribute('aria-label',name(i));check.addEventListener('change',()=>{state.selected=state.selected.filter(c=>c!==i.code);if(check.checked)state.selected.push(i.code);save();renderSummary();});label.append(check,document.createTextNode(name(i)));const unit=document.createElement('span');unit.className='item-unit';unit.textContent=i['unit_'+state.lang];first.append(label,unit);const qty=document.createElement('td');qty.className='right';const input=document.createElement('input');input.type='number';input.min='0';input.step='0.1';input.className='quantity';input.value=state.quantities[i.code];input.setAttribute('aria-label',name(i)+' '+t('quantity'));input.addEventListener('input',()=>{state.quantities[i.code]=input.value.trim()===''?null:Number(input.value);save();renderSummary();});qty.append(input);tr.append(first,qty,cell(money(i.observations[state.baseline].value),'right'),cell(money(i.observations['2026-08'].value),'right'),cell(percent(i.comparisons[state.baseline].change_percent),'right'));$('items').append(tr);}
 $('blocked').replaceChildren();
 for(const i of blocked){const tr=document.createElement('tr');tr.className='blocked-row';const first=document.createElement('td'),label=document.createElement('label');label.className='item-label';const check=document.createElement('input');check.type='checkbox';check.checked=state.blocked.includes(i.code);check.setAttribute('aria-label',name(i));check.addEventListener('change',()=>{state.blocked=state.blocked.filter(c=>c!==i.code);if(check.checked)state.blocked.push(i.code);save();renderSummary();});label.append(check,document.createTextNode(name(i)));first.append(label);const a=i.observations[state.baseline],b=i.observations['2026-08'];tr.append(first,cell(money(a.value)+' / '+a.source_unit,'right'),cell(money(b.value)+' / '+b.source_unit,'right'),cell(i['note_'+state.lang],'blocked-reason'));$('blocked').append(tr);}
}
function renderSummary(){
 $('beforeLabel').textContent=date(state.baseline);$('afterLabel').textContent=date('2026-08');
 const picked=eligible.filter(i=>state.selected.includes(i.code));
 let error=state.blocked.length?t('blocked'):picked.some(i=>typeof state.quantities[i.code]!=='number'||!Number.isFinite(state.quantities[i.code])||state.quantities[i.code]<0)?t('invalid'):null;
 const active=picked.filter(i=>state.quantities[i.code]>0);
 if(!error&&!active.length)error=t('empty');
 $('status').className='status'+(error?' warning':'');$('bars').classList.toggle('hidden',!!error);
 if(error){$('before').textContent=$('after').textContent=$('change').textContent='—';$('difference').textContent='';$('status').textContent=error;return;}
 const before=active.reduce((s,i)=>s+state.quantities[i.code]*i.observations[state.baseline].value,0),after=active.reduce((s,i)=>s+state.quantities[i.code]*i.observations['2026-08'].value,0);
 $('before').textContent=money(before);$('after').textContent=money(after);$('change').textContent=percent((after/before-1)*100);$('difference').textContent=(after-before>=0?'+':'')+money(after-before);
 $('oldBarLabel').textContent=date(state.baseline);$('newBarLabel').textContent=date('2026-08');$('oldBarValue').textContent=money(before);$('newBarValue').textContent=money(after);const scale=Math.max(before,after);$('oldBar').style.width=(before/scale*100)+'%';$('newBar').style.width=(after/scale*100)+'%';$('status').textContent=t('ready').replace('{n}',active.length).replace('{season}',t(state.baseline==='2000-08'?'sameMonth':'season'));
}
function render(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));$('english').setAttribute('aria-pressed',state.lang==='en');$('japanese').setAttribute('aria-pressed',state.lang==='ja');$('baseline').value=state.baseline;for(const option of $('baseline').options)option.textContent=date(option.value);for(const id of ['oldHeading','blockedOldHeading'])$(id).textContent=date(state.baseline);for(const id of ['newHeading','blockedNewHeading'])$(id).textContent=date('2026-08');renderRows();renderSummary();}
for(const [id,lang] of [['english','en'],['japanese','ja']])$(id).addEventListener('click',()=>{state.lang=lang;save();render();});
$('baseline').addEventListener('change',()=>{state.baseline=$('baseline').value;save();render();});$('reset').addEventListener('click',()=>{const lang=state.lang;state=defaults();state.lang=lang;save();render();});
for(const source of data.sources){const li=document.createElement('li'),a=document.createElement('a');a.href=source.url;a.textContent=source.name;a.target='_blank';a.rel='noopener';li.append(a);$('sources').append(li);}
render();
</script>
</body></html>
