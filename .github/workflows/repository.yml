name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Validate tracked source and JSON
        run: python scripts/check_repository.py
      - name: Rebuild audited endpoint demonstration
        run: python scripts/build_staple_price_test.py
      - name: Check reproducible outputs
        run: git diff --exit-code -- demo/staple-price-test.html demo/staple-price-test.json
      - name: Install ingestion test dependencies
        run: python -m pip install -r requirements-import.txt
      - name: Test ingestion format safeguards
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check data and calculation contracts
        run: npm test
      - name: Build static artifact from approved fixture
        run: npm run build
      - name: Install test browsers
        run: npm exec -- playwright install --with-deps chromium firefox webkit
      - name: Check desktop, mobile and browser-engine user flows
        run: npm run test:e2e
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: failed-browser-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
