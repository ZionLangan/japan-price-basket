name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Validate tracked source and JSON
        run: python scripts/check_repository.py
      - name: Rebuild audited endpoint demonstration
        run: python scripts/build_staple_price_test.py
      - name: Check reproducible outputs
        run: git diff --exit-code -- demo/staple-price-test.html demo/staple-price-test.json
