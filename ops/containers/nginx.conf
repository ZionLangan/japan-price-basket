worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 15s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    map "$status:$uri" $response_cache {
        default "no-store";
        "~^(200|206|304):/japan-basket/app-releases/app-[a-f0-9]{40}/" "public, max-age=31536000, immutable";
        "~^(200|304):/japan-basket/$" "no-cache";
        "~^(200|304):/japan-basket/(index.html|release.json)$" "no-cache";
    }
    server {
        listen 8080;
        server_name _;
        root /opt/site;
        add_header Cache-Control $response_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /livez { default_type text/plain; return 200 "alive\n"; }
        location = /readyz {
            default_type text/plain;
            if (!-f /tmp/ready) { return 503; }
            alias /tmp/ready;
        }
        location = /japan-basket { absolute_redirect off; return 308 /japan-basket/; }
        location = /japan-basket/release.json { alias /tmp/release.json; default_type application/json; }
        location = /japan-basket/ { alias /opt/site/; index index.html; }
        location = /japan-basket/index.html { alias /opt/site/index.html; }
        location = /japan-basket/THIRD_PARTY_NOTICES.txt { alias /opt/site/THIRD_PARTY_NOTICES.txt; }
        location ~ (^|/)\. { return 404; }
        location ~ /release-meta\.json$ { return 404; }
        location /japan-basket/app-releases/ { alias /tmp/release-root/; }
        # Never hide a missing JSON or JS file behind the HTML entry point.
        location / { return 404; }
    }
}
